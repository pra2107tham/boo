name: Release

# Tag a version and the DMG builds itself and attaches to the release,
# so the website's download link always points at something real.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Pin the toolchain so a runner-image bump cannot silently change
      # how strictly the concurrency rules are enforced.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Run checks
        run: swift run Boo --self-check

      - name: Build app and DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/build-app.sh "${VERSION:-1.0.0}"

      - name: Attach DMG to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body: |
            Download the DMG below, open it, and drag Boo to Applications.

            ### macOS will say it cannot verify Boo

            That is Gatekeeper — it says the same about every app not notarised
            by Apple, which needs a paid developer account. Boo is open source,
            so you can read every line it runs.

            Run this once after installing:

            ```
            xattr -dr com.apple.quarantine /Applications/Boo.app
            ```

            Boo then opens normally. If you would rather not use Terminal:
            right-click Boo and choose **Open**, or go to System Settings >
            Privacy & Security and click **Open Anyway**.
